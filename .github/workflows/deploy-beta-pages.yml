name: Deploy beta to GitHub Pages

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check

      # Build with base path for /purevoice/beta/
      - run: npm run build -- --base=/purevoice/beta/

      # Move build output under /beta so we can deploy alongside prod later if needed.
      - run: |
          mkdir -p out/beta
          cp -R dist/* out/beta/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
